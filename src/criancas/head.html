<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu primeiro aquário — Vinte litros de mundo para crianças</title>
<style>@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:block;src:url(fonts/fredoka.woff2) format('woff2');}
@font-face{font-family:'Atkinson Hyperlegible Next';font-style:normal;font-weight:200 800;font-display:block;src:url(fonts/font1.woff2) format('woff2');}
@font-face{font-family:'Atkinson Hyperlegible Next';font-style:italic;font-weight:200 800;font-display:block;src:url(fonts/font0.woff2) format('woff2');}
</style>
<style>/* ============ Vinte litros de mundo · edição para crianças ============ */
@page { size: A4 landscape; margin: 0; }
:root{
  --tinta:#1D2B3A; --ink:#16324A; --papel:#FFFDF6;
  --agua:#3FA7D6; --agua2:#DFF2FA; --sol:#FFC83D; --sol2:#FFF3CF; --coral:#F2665A; --coral2:#FDE6E2;
  --folha:#4FB06D; --folha2:#E2F4E6; --roxo:#8A6FD1; --roxo2:#EEE8FB; --areia:#F4E3C1; --cinza:#EEF1F3;
  --display:'Fredoka', 'Atkinson Hyperlegible Next', sans-serif;
  --texto:'Atkinson Hyperlegible Next', 'Segoe UI', Arial, sans-serif;
  --cor: var(--agua);
}
*{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
html,body{ margin:0; padding:0; }
body{ background:#C9D6DC; }
@media screen{ body{ padding:10mm 0; } }
.page{ position:relative; width:297mm; height:210mm; overflow:hidden; margin:0 auto 10mm; box-shadow:0 1.5mm 6mm rgba(15,30,40,.25);
  background:var(--papel); color:var(--tinta); font:400 14pt/19.5pt var(--texto); break-after:page; page-break-after:always; --mb:19mm; }
.page:last-of-type{ break-after:auto; page-break-after:auto; }
@media print{ body{ background:none; padding:0; } .page{ margin:0; box-shadow:none; } }
p{ margin:0; }
b, strong{ font-weight:700; }
img{ display:block; }
.sv{ display:block; width:100%; height:auto; }
.ic{ display:inline-block; width:8mm; height:8mm; vertical-align:middle; flex:none; }

/* onda e número da página */
.onda{ position:absolute; left:0; right:0; bottom:0; width:100%; height:15mm; }
.folio{ position:absolute; left:50%; bottom:3mm; transform:translateX(-50%); width:11mm; height:11mm; border-radius:50%; background:#fff;
  border:2pt solid var(--ink); display:flex; align-items:center; justify-content:center; font:600 12pt/1 var(--display); color:var(--ink); z-index:2; }
.nochrome .folio, .nochrome .onda{ display:none; }

/* moldura */
.frame{ position:absolute; top:11mm; bottom:var(--mb); left:16mm; right:16mm; display:flex; flex-direction:column; gap:4mm; }
.cols{ display:grid; gap:8mm; align-items:start; }
.cols > .col{ display:flex; flex-direction:column; gap:4mm; min-width:0; }
.cols.fill{ align-items:stretch; }
.frame > *{ flex:none; }
.grow{ flex:1 1 auto !important; min-height:0; }

/* títulos */
.chip{ align-self:flex-start; display:inline-flex; align-items:center; gap:2mm; padding:1.4mm 4mm 1.4mm 2mm; border-radius:6mm; background:var(--cor);
  border:2pt solid var(--ink); font:600 12pt/1 var(--display); color:var(--ink); }
.chip .ic{ width:7mm; height:7mm; background:#fff; border-radius:50%; padding:.6mm; }
.t{ margin:0; font:600 28pt/31pt var(--display); color:var(--ink); letter-spacing:-.005em; text-wrap:balance; }
.t small{ display:block; font-size:15pt; line-height:18pt; font-weight:500; color:var(--tinta); margin-top:1mm; }
.lead{ font-size:15pt; line-height:20pt; text-wrap:pretty; max-width:215mm; }
.h{ margin:0 0 2mm; font:600 17pt/20pt var(--display); color:var(--ink); }

/* caixas */
.box{ border:2pt solid var(--ink); border-radius:5mm; padding:3.5mm 4.5mm 4mm; background:#fff; }
.box .bh{ display:flex; align-items:center; gap:2mm; margin-bottom:1.6mm; font:600 14pt/1.1 var(--display); color:var(--ink); }
.box.adulto{ background:var(--coral2); } .box.sabia{ background:var(--roxo2); } .box.dica{ background:var(--sol2); }
.box.exp{ background:var(--folha2); } .box.jogo{ background:var(--agua2); }
.box p + p{ margin-top:1.6mm; }
.small{ font-size:12pt; line-height:16pt; }
.tiny{ font-size:10pt; line-height:13pt; }

/* grades */
.g2{ display:grid; grid-template-columns:1fr 1fr; gap:5mm; }
.g3{ display:grid; grid-template-columns:repeat(3,1fr); gap:4.5mm; }
.g4{ display:grid; grid-template-columns:repeat(4,1fr); gap:4mm; }
.g5{ display:grid; grid-template-columns:repeat(5,1fr); gap:4mm; }
.g6{ display:grid; grid-template-columns:repeat(6,1fr); gap:4mm; }
.row{ display:flex; gap:5mm; align-items:center; }
.center{ text-align:center; }

/* listas */
ol.num{ list-style:none; margin:0; padding:0; counter-reset:n; }
ol.num > li{ counter-increment:n; position:relative; padding-left:12mm; margin-bottom:2.6mm; min-height:9mm; }
ol.num > li::before{ content:counter(n); position:absolute; left:0; top:-.6mm; width:9mm; height:9mm; border-radius:50%; background:var(--cor);
  border:2pt solid var(--ink); font:600 13pt/8.6mm var(--display); text-align:center; color:var(--ink); }
ul.bol{ list-style:none; margin:0; padding:0; }
ul.bol > li{ position:relative; padding-left:7mm; margin-bottom:1.8mm; }
ul.bol > li::before{ content:''; position:absolute; left:0; top:2.4mm; width:3.6mm; height:3.6mm; border-radius:50%; background:var(--cor); border:1.5pt solid var(--ink); }
.check > li::before{ border-radius:1mm !important; background:#fff !important; width:4.6mm !important; height:4.6mm !important; top:1.6mm !important; }

/* escrever e desenhar */
.linha{ display:inline-block; border-bottom:1.8pt solid var(--ink); min-width:40mm; height:8mm; vertical-align:bottom; }
.linhas{ background:repeating-linear-gradient(transparent 0 10.5mm, #9FB3C0 10.5mm 11mm); }
.desenho{ border:2.2pt dashed var(--ink); border-radius:5mm; background:#fff; display:flex; align-items:flex-start; justify-content:flex-start; padding:3mm 4mm;
  font:500 12pt/1.2 var(--display); color:#6B7D89; }
.foto{ border:2pt solid var(--ink); border-radius:5mm; overflow:hidden; background:#fff; }
.foto img{ width:100%; height:100%; object-fit:cover; }
.cap{ margin-top:1.4mm; font:400 9pt/12pt var(--texto); color:#51606B; }
.cr{ font:400 7.5pt/10pt var(--texto); color:#7A8A94; }
.crs .cr{ font-size:6.5pt; line-height:8pt; }

/* fala do personagem */
.fala{ display:flex; gap:4mm; align-items:center; }
.fala .quem{ width:38mm; flex:none; }
.fala .balao{ position:relative; flex:1; background:#fff; border:2pt solid var(--ink); border-radius:6mm; padding:3.5mm 5mm; }
.fala .balao::before{ content:''; position:absolute; left:-4.4mm; top:50%; width:6mm; height:6mm; background:#fff; border-left:2pt solid var(--ink); border-bottom:2pt solid var(--ink); transform:translateY(-50%) rotate(45deg); }

/* cartões da turma e ferramentas */
.card{ border:2pt solid var(--ink); border-radius:5mm; background:#fff; padding:3mm 3.5mm 3.5mm; }
.card .pic{ height:26mm; display:flex; align-items:center; justify-content:center; margin-bottom:2mm; }
.card .pic .sv{ height:100%; width:auto; max-width:100%; }
.card > b{ display:block; font:600 14pt/1.15 var(--display); color:var(--ink); margin-bottom:1mm; }
.card p{ font-size:11.5pt; line-height:15pt; }

/* cartas das plantas */
.carta{ border:2.4pt solid var(--ink); border-radius:6mm; background:#fff; overflow:hidden; display:flex; flex-direction:column; }
.carta .topo{ display:flex; flex-direction:column; align-items:flex-start; gap:.6mm; padding:2.4mm 4mm; background:var(--c); border-bottom:2pt solid var(--ink); }
.carta .topo b{ font:600 15pt/1.1 var(--display); color:var(--ink); }
.carta .topo span{ font:500 10.5pt/1.1 var(--display); color:var(--ink); }
.carta .img{ height:60mm; border-bottom:2pt solid var(--ink); }
.carta .img img{ width:100%; height:100%; object-fit:cover; }
.carta .txt{ padding:2.8mm 4mm 3mm; font-size:11.5pt; line-height:15pt; flex:1; }
.carta .txt p + p{ margin-top:1.1mm; }
.carta .stats{ display:grid; grid-template-columns:auto 1fr; gap:.8mm 3mm; align-items:center; margin-top:2mm; font:500 10pt/1.1 var(--display); }
.pts{ display:inline-flex; gap:1mm; }
.pts i{ width:3.4mm; height:3.4mm; border-radius:50%; border:1.4pt solid var(--ink); background:#fff; }
.pts i.on{ background:var(--c); }
.carta .cr{ padding:0 4mm 2mm; }

/* tabelas */
table.tab{ width:100%; border-collapse:separate; border-spacing:0; border:2pt solid var(--ink); border-radius:4mm; overflow:hidden; font-size:12pt; line-height:16pt; background:#fff; }
table.tab th{ background:var(--cor); font:600 12.5pt/1.2 var(--display); color:var(--ink); text-align:left; padding:2mm 3mm; border-bottom:2pt solid var(--ink); }
table.tab td{ padding:2mm 3mm; border-bottom:1pt solid #C7D3DA; vertical-align:middle; }
table.tab tr:last-child td{ border-bottom:none; }
table.tab td.q{ width:24mm; text-align:center; }

/* calendário da contagem */
table.cal{ width:100%; border-collapse:separate; border-spacing:1.4mm 1mm; table-layout:fixed; }
table.cal th{ font:600 12pt/1 var(--display); color:var(--ink); padding-bottom:1mm; }
table.cal td{ height:13.4mm; text-align:center; vertical-align:middle; }
table.cal .d{ width:12.2mm; height:12.2mm; margin:0 auto; border-radius:50%; border:2pt solid var(--ink); background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font:600 13pt/1 var(--display); color:var(--ink); }
table.cal .d small{ font:500 7.5pt/1 var(--display); margin-top:.4mm; }
table.cal .d.m{ background:var(--sol); } table.cal .d.cam{ background:var(--coral); } table.cal .d.bet{ background:var(--agua); } table.cal .d.tst{ background:var(--roxo2); }
table.cal td.off .d{ border-style:dotted; border-color:#B6C4CC; color:#B6C4CC; background:transparent; }
.leg{ display:flex; flex-wrap:wrap; gap:2mm 6mm; font:500 11.5pt/1.2 var(--display); }
.leg span{ display:inline-flex; align-items:center; gap:1.8mm; }
.leg i{ width:5mm; height:5mm; border-radius:50%; border:1.6pt solid var(--ink); display:inline-block; }

/* caça-palavras */
table.cp{ border-collapse:collapse; margin:0 auto; }
table.cp td{ width:var(--cell); height:var(--cell); border:1.2pt solid #9FB3C0; text-align:center; vertical-align:middle; font:600 17pt/1 var(--display); color:var(--ink); background:#fff; }
table.cp td.hl{ background:var(--sol); }
table.cp.mini td{ font-size:8pt; }

/* quiz e escolhas */
.vf{ display:grid; grid-template-columns:1fr auto; gap:2.6mm 5mm; align-items:center; }
.vf .o{ display:inline-flex; gap:3mm; }
.vf .o span{ width:10mm; height:10mm; border-radius:50%; border:2pt solid var(--ink); display:flex; align-items:center; justify-content:center; font:600 13pt/1 var(--display); background:#fff; }
.circ{ display:inline-block; width:9mm; height:9mm; border-radius:50%; border:2pt solid var(--ink); background:#fff; vertical-align:middle; }

/* selos */
.selos{ display:grid; grid-template-columns:repeat(6,1fr); gap:7mm 6mm; }
.selo{ text-align:center; }
.selo .sv{ width:34mm; margin:0 auto 1.5mm; }
.selo b{ display:block; font:600 12.5pt/1.2 var(--display); color:var(--ink); }
.selo span{ font-size:10.5pt; }

/* capa e contracapa */
.capa{ background:linear-gradient(#8FD3EE, #3FA7D6 60%, #1F7FB0); }
.capa .ct{ position:absolute; top:18mm; left:18mm; width:128mm; color:#fff; }
.capa .ct p.kicker{ display:inline-block; padding:1.6mm 5mm; border-radius:6mm; background:#fff; border:2pt solid var(--ink); font:600 12pt/1 var(--display); color:var(--ink); }
.capa h1{ margin:7mm 0 0; font:700 56pt/54pt var(--display); color:#fff; -webkit-text-stroke:2.4pt var(--ink); paint-order:stroke fill; letter-spacing:-.01em; }
.capa .sub{ margin-top:5mm; font:600 17pt/1.25 var(--display); color:var(--ink); }
.capa .arte{ position:absolute; left:0; right:0; bottom:0; }
.capa .arte .sv{ width:100%; height:auto; }
.capa .age{ position:absolute; left:112mm; top:104mm; width:30mm; height:30mm; border-radius:50%; background:var(--sol); border:2.4pt solid var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center; font:700 17pt/1 var(--display); color:var(--ink); transform:rotate(-8deg); z-index:3; }
.capa .age small{ font:600 10pt/1.1 var(--display); }
.polaroid{ position:absolute; background:#fff; border:2pt solid var(--ink); padding:2.4mm 2.4mm 7mm; box-shadow:0 1.2mm 3mm rgba(10,30,50,.25); z-index:2; }
.polaroid img{ width:100%; height:100%; object-fit:cover; border:1pt solid var(--ink); }
.polaroid p{ position:absolute; left:0; right:0; bottom:1.4mm; text-align:center; font:600 11pt/1 var(--display); color:var(--ink); }
.contra{ background:linear-gradient(#3FA7D6, #16324A); color:#fff; }

/* página em paisagem para plastificar */
.page.landscape{ background:#fff; --mb:10mm; }
.est{ position:absolute; inset:9mm 11mm 9mm; display:flex; flex-direction:column; gap:3mm; }
.est .top{ display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2pt solid var(--ink); padding-bottom:2mm; }
.est h2{ margin:0; font:600 24pt/1 var(--display); color:var(--ink); }
table.st{ width:100%; border-collapse:separate; border-spacing:1.4mm; table-layout:fixed; }
table.st th{ font:600 13pt/1 var(--display); color:var(--ink); }
table.st th:first-child{ width:70mm; }
table.st td{ height:17.5mm; border:1.8pt solid var(--ink); border-radius:3mm; text-align:center; vertical-align:middle; background:#fff; }
table.st td:first-child{ border:none; text-align:left; font:500 14pt/1.2 var(--display); color:var(--ink); }
table.st td:first-child .lab{ display:flex; align-items:center; gap:2.4mm; }
table.st td:first-child .lab .sv, table.st td:first-child .lab .ic{ width:14mm; height:14mm; flex:none; }
table.st td.x{ background:repeating-linear-gradient(45deg, #EEF1F3 0 2mm, #fff 2mm 4mm); border-color:#C3CED5; }
table.st td .ic{ width:11mm; height:11mm; }
table.st td.n{ vertical-align:bottom; padding-bottom:1.5mm; }
</style>
</head>
<body>
